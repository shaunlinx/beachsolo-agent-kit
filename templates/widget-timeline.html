<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="use-iframe" content="true">
<meta name="html-box-height-mode" content="auto">
<meta name="description" content="作答过程时间线：前10题快速作答、中间停顿7分钟、补答第11题后交卷">
<title></title>
</head>
<body style="margin:0;background:#FFFFFF;font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;">
<div style="width:100%;max-width:100%;box-sizing:border-box;padding:4px 2px;color:#1F2329;">
  <div style="font-size:16px;font-weight:700;color:#1A2B4A;margin-bottom:12px;">作答过程回放 · 10 分钟内发生了什么</div>
  <div style="position:relative;height:14px;background:#EEF1F5;border-radius:7px;margin:30px 8px 0;">
    <div style="position:absolute;left:0;top:0;width:17%;height:100%;background:#C0392B;border-radius:7px 0 0 7px;"></div>
    <div style="position:absolute;left:17%;top:-3px;width:66%;height:20px;background:repeating-linear-gradient(45deg,#BABFC9,#BABFC9 4px,#DDE0E4 4px,#DDE0E4 8px);border-radius:3px;"></div>
    <div style="position:absolute;left:90%;top:0;width:10%;height:100%;background:#C0392B;border-radius:0 7px 7px 0;"></div>
  </div>
  <div style="display:flex;justify-content:space-between;font-size:12px;color:#758092;margin:4px 8px 20px;">
    <span>0s</span><span>103s</span><span>542s</span><span>597s 交卷</span>
  </div>
  <div style="display:flex;flex-direction:column;gap:10px;font-size:14px;line-height:1.6;">
    <div style="display:flex;gap:10px;align-items:flex-start;">
      <span style="flex:none;width:14px;height:14px;border-radius:50%;background:#C0392B;margin-top:3px;"></span>
      <div><b>第 1-10 题</b> <span style="color:#646A73;">17s→103s</span>：平均约 10 秒/题快速作答，9 题答错；第 1 题草稿改对却涂卡涂错。<span style="color:#C0392B;">扫题式作答</span></div>
    </div>
    <div style="display:flex;gap:10px;align-items:flex-start;">
      <span style="flex:none;width:14px;height:14px;border-radius:50%;background:#B9770E;margin-top:3px;"></span>
      <div><b>停顿约 7.3 分钟</b> <span style="color:#646A73;">103s→542s</span>：停留在第 10 题处未跳题、未标记（含 1 次 40s 暂停）。<span style="color:#B9770E;">取舍缺位</span></div>
    </div>
    <div style="display:flex;gap:10px;align-items:flex-start;">
      <span style="flex:none;width:14px;height:14px;border-radius:50%;background:#C0392B;margin-top:3px;"></span>
      <div><b>第 11 题</b> <span style="color:#646A73;">593s</span>：补答 C（错）后立即交卷，119 题未作答。<span style="color:#C0392B;">放弃全卷</span></div>
    </div>
  </div>
  <div style="margin-top:14px;font-size:12px;color:#758092;">数据口径：behaviorEventsRaw 事件时差归因（扣暂停、600s 闲置截断）。</div>
</div>
</body>
</html>
