<body style="margin:0;background:#FFFFFF;font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;">
<div style="width:100%;max-width:100%;box-sizing:border-box;padding:4px 2px;color:#1F2329;">
  <div style="font-size:16px;font-weight:700;color:#1A2B4A;margin-bottom:12px;">9 道错题 · 初步错因模式（基于选项差异，逐题带教时确认）</div>
  <div style="display:flex;flex-direction:column;gap:6px;font-size:13px;">
    <div style="display:flex;align-items:center;gap:8px;">
      <span style="width:70px;flex:none;font-weight:700;">记忆错误</span>
      <div style="flex:1;background:#EEF1F5;border-radius:4px;height:14px;overflow:hidden;"><div style="width:67%;height:100%;background:#1A2B4A;"></div></div>
      <span style="flex:none;width:110px;text-align:right;color:#1A2B4A;font-weight:700;">6 题（3/4/7/9/10/11）</span>
    </div>
    <div style="display:flex;align-items:center;gap:8px;">
      <span style="width:70px;flex:none;font-weight:700;">概念混淆</span>
      <div style="flex:1;background:#EEF1F5;border-radius:4px;height:14px;overflow:hidden;"><div style="width:33%;height:100%;background:#758092;"></div></div>
      <span style="flex:none;width:110px;text-align:right;color:#1A2B4A;font-weight:700;">3 题（1/2/8）</span>
    </div>
    <div style="display:flex;align-items:center;gap:8px;">
      <span style="width:70px;flex:none;font-weight:700;">誊写叠加</span>
      <div style="flex:1;background:#EEF1F5;border-radius:4px;height:14px;overflow:hidden;"><div style="width:11%;height:100%;background:#B9770E;"></div></div>
      <span style="flex:none;width:110px;text-align:right;color:#B9770E;font-weight:700;">1 题（第1题）</span>
    </div>
  </div>
  <div style="margin-top:14px;font-size:13px;line-height:1.7;color:#1F2329;">
    <b>主要模式：</b>本次错题以<b>记忆错误</b>为主（固定搭配、讲话原文记岔），辅以概念地位混淆；第 1 题叠加卷面草稿与涂卡不一致的<b>流程失误</b>信号。<br>
    <b>行为提示：</b>快速作答 + 不跳题停驻 + 直接交卷，说明本次更接近"凭印象扫答"，知识掌握与作答策略两条线都需要带教。
  </div>
  <div style="margin-top:8px;font-size:12px;color:#758092;">判定依据：数据包内选项差异对比（你的选项 vs 标准答案）；每题的最终错因以带教确认后写入知识库为准。</div>
